<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- خلفية أيقونة التطبيق بتدرج ليلي فخم -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18192a" />
      <stop offset="50%" stop-color="#10121d" />
      <stop offset="100%" stop-color="#08090e" />
    </linearGradient>

    <!-- إطار الضوء الخارجي -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6ad55" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#805ad5" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#3182ce" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d69e2e" stop-opacity="0.9" />
    </linearGradient>

    <!-- تدرج الذهب الخاص بالبرق والإنجاز -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- تدرج صفحات كتاب المعرفة -->
    <linearGradient id="bookGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="bookGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- تدرج هالة الهدف والإنجاز -->
    <linearGradient id="targetGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- فلاتر التوهج والظلال الناعمة -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="bookShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- جسم الأيقونة بشكل Squircle معتمد لنظام iOS وأندرويد الحديث -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="4" filter="url(#bookShadow)" />

  <!-- هالة الإنجاز الكونية الخلفية -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="url(#targetGlow)" stroke-width="3" stroke-dasharray="8 8" opacity="0.45" />
  <circle cx="256" cy="230" r="105" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.35" />

  <!-- نجوم وشرارات النجاح المحيطة -->
  <circle cx="160" cy="140" r="3.5" fill="#fde047" opacity="0.8" />
  <circle cx="350" cy="130" r="4.5" fill="#fde047" opacity="0.9" filter="url(#goldGlow)" />
  <circle cx="380" cy="260" r="3" fill="#38bdf8" opacity="0.7" />
  <circle cx="130" cy="270" r="3" fill="#ec4899" opacity="0.7" />
  <polygon points="360,180 364,190 374,194 364,198 360,208 356,198 346,194 356,190" fill="#fef08a" opacity="0.85" />
  <polygon points="150,210 153,218 161,221 153,224 150,232 147,224 139,221 147,218" fill="#fef08a" opacity="0.75" />

  <!-- كتاب المعرفة المفتوح (رمز الجلسات والدراسة والانضباط) -->
  <g filter="url(#bookShadow)">
    <!-- الجناح الأيسر للكتاب -->
    <path d="M 256 348 C 220 330 160 325 110 340 C 98 343 88 334 88 322 L 88 220 C 88 210 98 202 108 199 C 158 184 218 190 256 210 Z" 
          fill="url(#bookGradLeft)" opacity="0.95" />
    <!-- طبقة صفحة ثانية لأعطاء عمق -->
    <path d="M 256 338 C 224 322 168 318 120 332 L 120 215 C 168 201 224 205 256 222 Z" 
          fill="#3730a3" opacity="0.6" />

    <!-- الجناح الأيمن للكتاب -->
    <path d="M 256 348 C 292 330 352 325 402 340 C 414 343 424 334 424 322 L 424 220 C 424 210 414 202 404 199 C 354 184 294 190 256 210 Z" 
          fill="url(#bookGradRight)" opacity="0.95" />
    <!-- طبقة صفحة ثانية لليمين -->
    <path d="M 256 338 C 288 322 344 318 392 332 L 392 215 C 344 201 288 205 256 222 Z" 
          fill="#4338ca" opacity="0.6" />

    <!-- عمود الكتاب السفلي المتوهج -->
    <ellipse cx="256" cy="350" rx="14" ry="6" fill="#1e1b4b" />
  </g>

  <!-- صاعقة البرق وعلامة الإنجاز الذهبية المتوهجة الصاعدة من قلب الكتاب -->
  <g filter="url(#goldGlow)">
    <!-- برق الإنجاز ⚡ المنطلق للأعلى باتجاه القمة -->
    <polygon points="272,96 208,230 252,230 236,334 312,192 266,192" 
             fill="url(#goldGrad)" 
             stroke="#ffffff" 
             stroke-width="2.5" 
             stroke-linejoin="round" />
    
    <!-- نواة الطاقة البيضاء شديدة التوهج في البرق -->
    <polygon points="270,110 220,224 252,224 242,300 298,198 266,198" 
             fill="#ffffff" 
             opacity="0.5" />
  </g>

  <!-- علامة صح الإنجاز الدقيقة في قلب التصميم -->
  <circle cx="370" cy="370" r="28" fill="#10b981" filter="url(#goldGlow)" />
  <path d="M 358 370 L 366 378 L 382 362" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

</svg>
